services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ${NUSCENES_DB_HOST_PATH:?set NUSCENES_DB_HOST_PATH}:/data/scene_data.db:ro
      - ${NUSCENES_CAMERAS_HOST_DIR:?set NUSCENES_CAMERAS_HOST_DIR}:/data/cameras:ro

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

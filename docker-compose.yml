services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"   # localhost only — Apache proxies externally
    volumes:
      - ${NUSCENES_DB_HOST_PATH:?set NUSCENES_DB_HOST_PATH}:/data/scene_data.db:ro
      - ${NUSCENES_CAMERAS_HOST_DIR:?set NUSCENES_CAMERAS_HOST_DIR}:/data/cameras:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Path prefix Apache exposes for the API, e.g. /DriverQ
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL to the Apache path prefix, e.g. /DriverQ}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"   # localhost only — Apache proxies externally
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
